# Static SPA hosting for the Vite build output, with gzip and an SPA
# history-fallback (unknown paths -> index.html; the app is client-routed).
#
# API proxy note: this app currently talks to the API directly at the
# absolute, build-time-baked `VITE_API_URL` (see apps/web/src/api/client.ts),
# not via a same-origin path prefix — so no proxy_pass is required for the
# default docker-compose setup (the browser calls the api service's
# published port directly). If you'd rather present a single origin
# (avoids CORS entirely, nicer behind a real domain/TLS), rebuild the web
# image with `--build-arg VITE_API_URL=/api` and uncomment the location
# block below, matching it up with the api service name in docker-compose.yml:
#
# location /api/ {
#   proxy_pass http://api:3001/;
#   proxy_set_header Host $host;
#   proxy_set_header X-Real-IP $remote_addr;
#   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
# }

server {
  # 8080, not 80: the image runs as a non-root user (see apps/web/Dockerfile),
  # and binding a port below 1024 needs CAP_NET_BIND_SERVICE. Keeping the
  # listener unprivileged means the container needs no added capabilities in
  # Kubernetes and can run with a read-only root filesystem.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
  gzip_min_length 1024;

  # Fingerprinted build assets: cache aggressively.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
