# TEMPLATE — do not apply as-is, and do not commit a filled-in copy.
#
# The base kustomization deliberately does NOT include this file, so a stray
# `kubectl apply -k` can never ship placeholder credentials. Create the real
# Secret out-of-band instead:
#
#   kubectl -n interior-design create secret generic api-secrets \
#     --from-literal=SESSION_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=DATABASE_URL='postgresql://user:pass@host:5432/interior' \
#     --from-literal=OPENAI_API_KEY='sk-...' \
#     --from-literal=AI_PROVIDER_API_KEY='sk-...'
#
# ...or point a real secret manager (External Secrets, Sealed Secrets, Vault
# Agent, your cloud's CSI driver) at the same name and keys. The Deployment
# consumes every key with `optional: true`, so a Secret containing only the
# keys you actually use is valid.
#
# Key notes:
#   SESSION_SECRET      Signs the anonymous-ownership cookie. MUST be set: with
#                       it unset the API logs a warning and falls back to a
#                       hard-coded development default, which would let anyone
#                       forge ownership of any design. Rotating it invalidates
#                       existing sessions (designs themselves are unaffected).
#   DATABASE_URL        Selects the Postgres backend. Unset/blank falls back to
#                       the file-backed JSON store, which is per-pod and does
#                       NOT survive rescheduling — fine for a demo, wrong for
#                       anything with more than one replica.
#   OPENAI_API_KEY      Photo room-import + photoreal light-study re-lighting.
#   AI_PROVIDER_API_KEY The chat assistant (FEATURE_AI=true).
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
type: Opaque
stringData:
  SESSION_SECRET: "replace-me-with-a-long-random-value"
  DATABASE_URL: "postgresql://interior:interior@postgres:5432/interior"
  OPENAI_API_KEY: ""
  AI_PROVIDER_API_KEY: ""
